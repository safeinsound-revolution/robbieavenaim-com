backend:
  name: github
  repo: safeinsound-revolution/robbieavenaim-com
  branch: main
  # One-click "Sign in with GitHub" via the shared sveltia-cms-auth OAuth
  # bridge on Robbie's Cloudflare account (the same worker Safe in Sound uses).
  # See README "CMS setup". To sign in with a personal access token instead,
  # you can comment out base_url.
  base_url: https://sveltia-cms-auth.robbie-avenaim.workers.dev
  auth_endpoint: auth

media_folder: "public/images"
public_folder: "/images"

site_url: https://robbieavenaim.com
logo_url: /favicon.svg

collections:
  - name: pages
    label: Pages
    files:
      - file: src/content/home.json
        label: Homepage
        name: home
        fields:
          - { label: Hero Image, name: heroImage, widget: image }
          - { label: Hero Image Caption, name: heroCaption, widget: string, required: false }
          - label: Show "Upcoming Events" section
            name: showUpcomingEvents
            widget: boolean
            default: true
            hint: 'Turn off to hide the section without deleting the events below. It also hides automatically whenever the list is empty.'
          - label: Upcoming Events
            name: upcomingEvents
            widget: list
            required: false
            hint: 'Add a gig or show for each event. Leave the list empty to hide the section from the homepage.'
            fields:
              - label: Date
                name: date
                widget: string
                hint: 'Free text, e.g. "Sat 12 Sep 2026" or "12–14 Sep 2026".'
              - { label: Event Title, name: title, widget: string }
              - label: Venue / Location
                name: venue
                widget: string
                required: false
                hint: 'e.g. "Sydney Opera House, Sydney".'
              - { label: Details, name: details, widget: text, required: false }
              - label: Link URL
                name: link
                widget: string
                required: false
                hint: 'Optional tickets or info link.'
              - label: Link Label
                name: linkLabel
                widget: string
                required: false
                hint: 'Optional. Defaults to "More info".'

      - file: src/content/about.json
        label: About / Biography
        name: about
        fields:
          - { label: Portrait, name: portrait, widget: image }
          - { label: Short Bio (shown on homepage-linked intro), name: shortBio, widget: text }
          - label: Full Biography
            name: fullBio
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }

      - file: src/content/contact.json
        label: Contact & Socials
        name: contact
        fields:
          - { label: Instagram URL, name: instagram, widget: string, required: false }
          - { label: Facebook URL, name: facebook, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    # Drag-and-drop ordering: use the "Reorder" button in the Projects list.
    # New projects are added to the bottom; drag them where you want them.
    reorder: true
    description: 'Order on the site = order in this list. Click "Reorder" to drag items up or down.'
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Hero Image, name: heroImage, widget: image, required: false }
      - { label: External Website URL, name: externalUrl, widget: string, required: false }
      - label: Videos
        name: videos
        widget: list
        required: false
        hint: 'Add a clip for each video. Leave the list empty to hide the video section entirely.'
        fields:
          - label: Video URL
            name: url
            widget: string
            hint: 'Paste a YouTube or Vimeo link (or a direct .mp4 / .webm file URL).'
          - { label: Caption, name: caption, widget: string, required: false }
          - label: Video thumbnail
            name: poster
            widget: image
            required: false
            hint: 'Optional. Only used for a direct .mp4 / .webm file — an image shown before the video plays. YouTube/Vimeo supply their own thumbnail.'
      - label: Gallery
        name: gallery
        widget: list
        required: false
        field: { label: Image, name: image, widget: image }
      - { label: Body, name: body, widget: markdown }

  - name: discography
    label: Discography
    folder: src/content/discography
    create: true
    slug: "{{slug}}"
    reorder: true
    description: 'Order on the site = order in this list. Click "Reorder" to drag releases up or down.'
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Credits, name: credits, widget: text }
      - { label: Label / Catalogue, name: label, widget: string, required: false }
      - { label: Year, name: year, widget: string, required: false }
      - { label: Cover Image, name: image, widget: image, required: false }
      - label: Links
        name: links
        widget: list
        required: false
        fields:
          - { label: Link Label, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Sold Out, name: soldOut, widget: boolean, default: false }

  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    create: true
    slug: "{{slug}}"
    reorder: true
    description: 'Order on the site = order in this list. Click "Reorder" to drag quotes up or down.'
    summary: "{{author}}"
    fields:
      - { label: Quote, name: quote, widget: text }
      - { label: Author / Attribution, name: author, widget: string }

  - name: grants
    label: Grants & Awards
    folder: src/content/grants
    create: true
    # No ordering to maintain here: the page puts each entry in the section named
    # by its Group, and sorts each section by Year, newest first. Just add and go.
    slug: "{{group}}-{{year}}-{{description | truncate(40)}}"
    description: "Nothing to order here — each entry goes into the section chosen in its Group field, newest year first."
    summary: "{{year}} — {{description}}"
    sortable_fields:
      fields: [year, group, description]
      default: { field: year, direction: descending }
    fields:
      - label: Year
        name: year
        widget: string
        hint: 'Usually one year, e.g. "2026". A multi-year grant can list them all ("2002, 2003, 2005") — it''s sorted by the first year shown.'
      - { label: Description, name: description, widget: text }
      - label: Group
        name: group
        widget: select
        hint: "Which section of the Grants & Awards page this appears in."
        options:
          - { label: "Grants awarded to the artist", value: artist }
          - { label: "WHAT IS MUSIC? Festival grants", value: festival }
          - { label: "Philanthropic support", value: philanthropic }
